name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m compileall -q app examples experiments tests
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.offline_demo
      - run: python -m experiments.simulate --seeds 2 --train 120 --test 60 --output artifacts/ci
